[platformio]
default_envs = usb

[env:freenove_esp32_wrover]
platform = espressif32
board = freenove_esp32_wrover
framework = arduino
monitor_speed = 115200

[env:usb]
extends = env:freenove_esp32_wrover
build_flags = -DSIGMA_CAMARA_USB
monitor_speed = 460800

[env:presentacion]
extends = env:freenove_esp32_wrover
build_flags =
    -DSIGMA_CAMARA_PRESENTACION
    -I"../esp32-procesador/include"
