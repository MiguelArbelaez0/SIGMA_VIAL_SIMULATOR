[build-system]
requires = ["setuptools>=80,<83", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-vial"
version = "0.1.0"
description = "Base de escritorio para el simulador vial de SIGMA SOFTWARE SOLUTIONS"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["PySide6>=6.10,<7"]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-qt>=4.5,<5",
    "ruff>=0.14,<1",
    "pip-tools>=7.5,<8",
    "setuptools>=80,<83",
    "wheel>=0.45,<1",
]

[project.gui-scripts]
sigma-vial = "sigma_vial.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
qt_api = "pyside6"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
